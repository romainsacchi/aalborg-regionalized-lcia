# From this directory, run: conda env create -f bw_env_osxARM.yaml

name: bw
channels:
  - conda-forge
  - cmutel
  - lca
  - romainsacchi
dependencies:
  - python=3.11
  - stats_arrays
  - numpy=1.24.4
  - pandas<3.0.0
  - scipy<1.14.0
  - sparse>=0.14.0,<0.18
  - bottleneck
  - jupyterlab
  - openpyxl
  - matplotlib
  - plotly
  - networkx
  - seaborn
  - prettytable
  - constructive_geometries>=1.0.0
  - country_converter
  - ecoinvent_interface
  - cryptography
  - datapackage
  - platformdirs
  - pyarrow
  - pycountry
  - python-dotenv
  - pyyaml
  - requests
  - schema
  - xarray<=2024.2.0
  - tqdm
  - fair
  - pyvis
  - scikit-umfpack
  - pip<26
  - setuptools<81
  - pip:
      - bw2calc>=2.5.0
      - bw2data>=4.7
      - bw2io>=0.9.17
      - bw2analyzer>=0.11.8
      - bw2parameters>=1.1.0
      - bw-processing>=1.6
      - edges==1.4.0
      - multifunctional==1.1.1
      - bw_simapro_csv==0.4.3
      - d3blocks==1.2.8
      - polyviz==1.0.4
      - PySide6==6.9.3
      - PySide6-Addons==6.9.3
      - activity-browser
variables:
  PYTHONNOUSERSITE: "1"
